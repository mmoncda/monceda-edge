[server]
host = "127.0.0.1"
port = 8787
static_dir = "public"

[proxy]
enabled = true
upstream = "http://127.0.0.1:3000"
health_path = "/"
load_balancing = "round_robin"
health_check_enabled = true
health_check_interval_seconds = 10
health_check_timeout_seconds = 3
circuit_breaker_enabled = true
circuit_breaker_failures = 2
circuit_breaker_cooldown_seconds = 15

[cache]
enabled = true
ttl_seconds = 30

[security]
enabled = true
rate_limit_enabled = true
requests_per_minute = 120
allow_ips = []
deny_ips = []

[control_plane]
enabled = true
allow_loopback_without_token = true
token_env = "MONCEDA_EDGE_CONTROL_TOKEN"

[http]
enabled = true
port = 8080
redirect_to_https = true

[public_node]
enabled = false
primary_domain = ""
expected_ipv4 = ""

[deployment]
mode = "development"
require_public_ports = false
require_public_domains = false

[acme]
enabled = true
environment = "staging"
email = ""
cache_dir = "certs/acme"
challenge = "http-01"

[tls]
enabled = true
port = 8443
cert = "certs/localhost-cert.pem"
key = "certs/localhost-key.pem"

[[routes]]
host = "dashboard.local"
upstream = "http://127.0.0.1:3000"

[[routes]]
host = "app.local"
upstream = "http://127.0.0.1:4000"
