[server]
host = "0.0.0.0"
port = 8787
static_dir = "public"

[proxy]
enabled = true
upstream = "http://127.0.0.1:3000"
health_path = "/"
health_check_enabled = true
health_check_interval_seconds = 10
health_check_timeout_seconds = 3
circuit_breaker_enabled = true
circuit_breaker_failures = 2
circuit_breaker_cooldown_seconds = 15

[cache]
enabled = true
ttl_seconds = 30

[security]
enabled = true
rate_limit_enabled = true
requests_per_minute = 120
allow_ips = []
deny_ips = []

[control_plane]
enabled = true
allow_loopback_without_token = false
token_env = "MONCEDA_EDGE_CONTROL_TOKEN"

[http]
enabled = true
port = 80
redirect_to_https = true

[public_node]
enabled = true
primary_domain = "edge.moncedalabs.com"
expected_ipv4 = "136.158.56.129"

[deployment]
mode = "production"
require_public_ports = true
require_public_domains = true

[acme]
enabled = true
environment = "staging"
email = "shancerecel101@gmail.com"
cache_dir = "certs/acme"
challenge = "http-01"

[tls]
enabled = true
port = 443
cert = "certs/localhost-cert.pem"
key = "certs/localhost-key.pem"

[[routes]]
host = "edge.moncedalabs.com"
upstream = "http://127.0.0.1:3000"
